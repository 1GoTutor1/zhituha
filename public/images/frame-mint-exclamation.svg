<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <filter id="mint-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.20 0 0 0 0 0.94 0 0 0 0 0.78 0 0 0 .82 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mark { font-family: Arial, sans-serif; font-weight: 900; text-anchor: middle; dominant-baseline: central; fill: #71ffdf; stroke: #15312c; stroke-width: 1.1px; paint-order: stroke; filter: url(#mint-glow); }
    </style>
  </defs>
