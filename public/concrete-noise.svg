<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <filter id="raw-concrete" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="5" seed="17" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <filter id="concrete-pores" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.45" numOctaves="2" seed="31" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="220" height="220" filter="url(#raw-concrete)" opacity="0.34" />
  <rect width="220" height="220" filter="url(#concrete-pores)" opacity="0.24" />
</svg>
