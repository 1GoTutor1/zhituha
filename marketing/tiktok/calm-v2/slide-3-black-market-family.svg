<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#211a2b"/><stop offset=".55" stop-color="#17131f"/><stop offset="1" stop-color="#171b1b"/></linearGradient><radialGradient id="glow"><stop stop-color="#71603d" stop-opacity=".3"/><stop offset="1" stop-color="#17131f" stop-opacity="0"/></radialGradient><linearGradient id="gold" x2="1"><stop stop-color="#f0d18d"/><stop offset="1" stop-color="#d9a95f"/></linearGradient><filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#08060b" flood-opacity=".5"/></filter></defs>
<rect width="1080" height="1920" fill="url(#bg)"/><ellipse cx="690" cy="690" rx="690" ry="560" fill="url(#glow)"/>
<text x="76" y="104" fill="#d9c9e8" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">ЖИТУХА</text><text x="1004" y="104" text-anchor="end" fill="#9b91a4" font-family="Arial,sans-serif" font-size="21" letter-spacing="2">ИГРА ПРО БОЛЬШУЮ ЖИЗНЬ</text><path d="M76 144H1004" stroke="#ffffff" stroke-opacity=".12"/>
<text x="76" y="250" fill="#f4efe9" font-family="Arial,sans-serif" font-size="72" font-weight="700">Свои люди.</text><text x="76" y="338" fill="#f4efe9" font-family="Arial,sans-serif" font-size="72" font-weight="700">Общие дела.</text><text x="80" y="402" fill="#bcb2c5" font-family="Arial,sans-serif" font-size="29">Лови приезд торговца и выходи</text><text x="80" y="443" fill="#bcb2c5" font-family="Arial,sans-serif" font-size="29">на дело вместе со своей семьёй.</text>
<g filter="url(#shadow)"><rect x="76" y="520" width="928" height="1040" rx="38" fill="#211a2b" stroke="#52435e" stroke-width="2"/>
<rect x="112" y="560" width="856" height="404" rx="28" fill="#1b1624" stroke="#40354a" stroke-width="2"/><circle cx="174" cy="624" r="29" fill="#49362d"/><path d="M161 617h26m-23 9h20m-16 9h12" stroke="#e4bb7a" stroke-width="4" stroke-linecap="round"/><text x="222" y="617" fill="#f2edf5" font-family="Arial,sans-serif" font-size="27" font-weight="700">Чёрный рынок</text><text x="222" y="653" fill="#ad9fb6" font-family="Arial,sans-serif" font-size="19">Торговец на месте</text><rect x="776" y="592" width="154" height="42" rx="21" fill="#263a2c"/><circle cx="800" cy="613" r="6" fill="#83ce90"/><text x="818" y="620" fill="#a9dfae" font-family="Arial,sans-serif" font-size="16" font-weight="700">ОТКРЫТ</text>
<text x="148" y="720" fill="#9e91a7" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">ЧАСЫ РАБОТЫ · МОСКВА</text><rect x="148" y="744" width="365" height="82" rx="20" fill="#2a2233"/><text x="330" y="797" text-anchor="middle" fill="#f4efe9" font-family="Arial,sans-serif" font-size="29" font-weight="700">07:00 — 11:00</text><rect x="535" y="744" width="395" height="82" rx="20" fill="#2a2233"/><text x="732" y="797" text-anchor="middle" fill="#f4efe9" font-family="Arial,sans-serif" font-size="29" font-weight="700">15:00 — 19:00</text>
<path d="M148 855H930" stroke="#ffffff" stroke-opacity=".1"/><text x="148" y="901" fill="#e9e0ed" font-family="Arial,sans-serif" font-size="22">Цена скупки меняется с каждым приездом.</text><text x="148" y="937" fill="#b6a9bf" font-family="Arial,sans-serif" font-size="20">Рассаду можно выращивать между визитами.</text>
<rect x="112" y="998" width="856" height="376" rx="28" fill="#201a2b" stroke="#40354a" stroke-width="2"/><text x="148" y="1060" fill="#dfc687" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">СЕМЕЙНОЕ СОБЫТИЕ</text><text x="148" y="1122" fill="#f4efe9" font-family="Arial,sans-serif" font-size="34" font-weight="700">Совместная поставка</text><text x="148" y="1167" fill="#bcb2c5" font-family="Arial,sans-serif" font-size="22">Участвуйте вместе, чтобы закрыть цель события.</text>
<rect x="148" y="1210" width="782" height="2" fill="#ffffff" opacity=".1"/><text x="148" y="1272" fill="#a99daf" font-family="Arial,sans-serif" font-size="20">Награда семье за успех</text><rect x="148" y="1300" width="330" height="54" rx="18" fill="#3a3024"/><text x="313" y="1337" text-anchor="middle" fill="url(#gold)" font-family="Arial,sans-serif" font-size="22" font-weight="700">+15 очков семьи</text>
<rect x="112" y="1410" width="856" height="104" rx="24" fill="#2b2331"/><circle cx="166" cy="1462" r="24" fill="#41352a"/><path d="M154 1464q12-22 24 0m-19 6h14" fill="none" stroke="#e3c27e" stroke-width="4" stroke-linecap="round"/><text x="210" y="1455" fill="#eee8f1" font-family="Arial,sans-serif" font-size="22" font-weight="700">Выращивание занимает 4 часа</text><text x="210" y="1487" fill="#aa9fb3" font-family="Arial,sans-serif" font-size="18">Планируй заранее — и будь готов к приезду.</text></g>
<text x="76" y="1660" fill="#dfc687" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">ЧЁРНЫЙ РЫНОК · СЕМЕЙНЫЕ СОБЫТИЯ</text><text x="76" y="1740" fill="#f4efe9" font-family="Arial,sans-serif" font-size="30" font-weight="700">Время приезда — повод собраться.</text><text x="76" y="1790" fill="#bcb2c5" font-family="Arial,sans-serif" font-size="23">Планируй, координируйся и играй командой.</text><path d="M76 1822H1004" stroke="#ffffff" stroke-opacity=".14"/><text x="76" y="1872" fill="#8e8495" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">ЖИТУХА</text><text x="1004" y="1872" text-anchor="end" fill="#8e8495" font-family="Arial,sans-serif" font-size="19">03 / 03</text></svg>
