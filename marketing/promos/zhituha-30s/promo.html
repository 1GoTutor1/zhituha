nsform-origin:center;will-change:transform}.screen-shade{position:absolute;inset:0;background:linear-gradient(180deg,#0d0b1470 0%,transparent 18%,transparent 75%,#100d1870 100%);pointer-events:none}.tab-pill{position:absolute;z-index:2;left:88px;top:90px;padding:16px 23px;border:1px solid #ffffff30;border-radius:28px;background:#17131dbd;color:#eee7f1;font-size:22px;letter-spacing:2px;backdrop-filter:blur(12px)}.progress-line{position:absolute;z-index:4;left:78px;right:78px;top:151px;height:3px;background:#ffffff27;border-radius:5px}.progress-line i{display:block;height:100%;background:#d7b96f;width:0;border-radius:5px;box-shadow:0 0 16px #d7b96f}#outro .end-small{bottom:290px}.scene>.caption{display:none}.caption{position:absolute;z-index:5;left:72px;right:72px;bottom:84px;min-height:118px;padding:20px 26px;border-radius:22px;background:linear-gradient(110deg,#17131deF,#17131dcf);border:1px solid #ffffff22;box-shadow:0 14px 36px #0007;text-align:center;display:flex;align-items:center;justify-content:center;font-size:37px;line-height:1.28;font-weight:700;color:#fff;text-shadow:0 2px 5px #000;white-space:pre-line}.end-center{position:absolute;left:70px;right:70px;top:590px;text-align:center}.end-title{font-size:106px;font-weight:800;letter-spacing:5px}.end-sub{margin-top:32px;color:#cbbfd3;font-size:37px}.cta{display:inline-block;margin-top:100px;padding:23px 42px;border-radius:18px;background:#d6b86e;color:#201a25;font-size:28px;font-weight:700;box-shadow:0 10px 42px #d6b86e30}.end-small{position:absolute;bottom:138px;left:0;right:0;text-align:center;color:#a99eae;letter-spacing:4px;font-size:20px}.spark{position:absolute;width:4px;height:4px;background:#e6cb88;border-radius:50%;box-shadow:0 0 14px #e6cb8880;opacity:.55}.s1{left:18%;top:34%}.s2{right:21%;top:29%}.s3{left:26%;bottom:27%}.s4{right:17%;bottom:32%}
</style></head><body><main class="frame">

</main><div id="globalCaption" class="caption"></div><script>
const duration=28.5,scenes=[{id:'intro',a:0,b:4.2},{id:'jobs',a:4.2,b:10.4,focus:[0,70]},{id:'business',a:10.4,b:15.2,focus:[0,-35]},{id:'market',a:15.2,b:24.84,focus:[0,95]},{id:'outro',a:24.84,b:28.5}],captions=[
{a:0,b:4.31,t:'В Житухе можно начать с обычной работы — и постепенно вырасти.'},
{a:4.85,b:7.40,t:'Выбирай профессию,'},
{a:7.69,b:9.95,t:'выполняй заказы,'},
{a:10.31,b:11.61,t:'закрывай ежедневные задания.'},
{a:11.61,b:14.17,t:'Открой бизнес: следи за товарами, продажами и кассой.'},
{a:14.49,b:17.91,t:'А когда приезжает торговец чёрного рынка,'},

const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
window.renderAt=t=>{t=Math.max(0,Math.min(duration,t));for(const s of scenes){const el=document.getElementById(s.id),p=Math.max(0,Math.min(1,(t-s.a)/(s.b-s.a)));el.classList.toggle('show',t>=s.a&&t<s.b);el.style.opacity=String(t<s.a||t>=s.b?0:t<s.a+.32?ease((t-s.a)/.32):t>s.b-.32?ease((s.b-t)/.32):1);if(s.id==='intro'||s.id==='outro'){const g=el.querySelector('.backglow');g.style.transform='scale('+(1.02+.08*Math.sin(t*.65))+')';}else{const img=el.querySelector('.screen'),q=ease(p);img.style.transform='scale('+(1.015+.055*q)+') translate3d(0,'+(s.focus[1]*q)+'px,0)';const bar=el.querySelector('.progress-line i');bar.style.width=(p*100)+'%';}}
const c=captions.find(x=>t>=x.a&&t<x.b);const sub=document.getElementById('globalCaption');sub.textContent=c?.t||'';sub.style.opacity=c?'1':'0';
};window.renderAt(0);
