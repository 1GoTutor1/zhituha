const D=8,frame=document.getElementById('frame'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),playBtn=document.getElementById('play'),$=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,p)=>a+(b-a)*p;
function footPose(phase,hip,lead){const stride=78,stepHeight=38;let x,lift;if(phase<.62){x=lead-(phase/.62)*stride;lift=0}else{const q=(phase-.62)/.38;x=lead-stride+stride*smooth(q);lift=Math.sin(Math.PI*q)*stepHeight}return{x:hip+x,y:449-lift,lift}}

 const L=footPose(phaseL,222,31),R=footPose(phaseR,278,58);function leg(prefix,hip,p){const kneeX=mix(hip,p.x,.48)+Math.sin((prefix==='left'?phaseL:phaseR)*Math.PI*2)*7,kneeY=mix(350-bob,p.y,.48)-p.lift*.15;const d='M'+hip+' '+(350-bob)+' Q'+kneeX+' '+kneeY+' '+p.x+' '+p.y;$(prefix+'LegOutline').setAttribute('d',d);$(prefix+'LegFill').setAttribute('d',d);$(prefix+'Shoe').setAttribute('d','M'+(p.x-30)+' '+p.y+'h34')}
 leg('left',222,L);leg('right',278,R);const swing=Math.sin(cycle*2*Math.PI);const elbowLY=228-bob*.35+swing*5,elbowLX=252+swing*9,elbowRY=230-bob*.35-swing*5,elbowRX=344-swing*8;function setArm(outline,fill,shoulder,elbow,hand){const d='M'+shoulder[0]+' '+(shoulder[1]-bob)+' Q'+elbow[0]+' '+elbow[1]+' '+hand[0]+' '+hand[1];$(outline).setAttribute('d',d);$(fill).setAttribute('d',d)}setArm('armLOutline','armLFill',[190,192],[elbowLX,elbowLY],[350,267]);setArm('armROutline','armRFill',[310,192],[elbowRX,elbowRY],[390,267]);$("handL").setAttribute('cy','267');$("handR").setAttribute('cy','267');const wheelAngle=distance*1.6/16;$("wheelL").setAttribute('transform','rotate('+wheelAngle+' 416 430)');$("wheelR").setAttribute('transform','rotate('+wheelAngle+' 474 430)');const clockText='00:'+String(Math.floor(t)).padStart(2,'0')+'.'+String(Math.floor(t%1*100)).padStart(2,'0')+' / 00:08.00';clock.textContent=clockText;seek.value=t;}
let playing=false,raf=0,base=0,stamp=0;function now(){return playing?Math.min(D,base+(performance.now()-stamp)/1000):base}function tick(){base=now();renderAt(base);if(base>=D){playing=false;playBtn.textContent='▶ Старт';return}raf=requestAnimationFrame(tick)}function play(){if(playing)return;if(base>=D)base=0;playing=true;stamp=performance.now();playBtn.textContent='Ⅱ Пауза';raf=requestAnimationFrame(tick)}function pause(){if(!playing)return;base=now();playing=false;cancelAnimationFrame(raf);playBtn.textContent='▶ Старт';renderAt(base)}playBtn.onclick=()=>playing?pause():play();$('restart').onclick=()=>{pause();base=0;renderAt(0);play()};seek.oninput=()=>{pause();base=+seek.value;renderAt(base)};window.renderAt=renderAt;renderAt(0);
</script></body></html>
